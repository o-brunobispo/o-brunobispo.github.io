<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Online</title>
  <!-- Biblioteca para converter elementos HTML em Imagem PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 440px; }
    
    .logo { display: block; margin: 0 auto 20px; width: 150px; height: auto; }
    
    h2 { margin-top: 0; margin-bottom: 24px; color: #1e293b; text-align: center; font-size: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #2563eb; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    @media (max-width: 400px) {
      .row { grid-template-columns: 1fr; }
    }

    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #statusMessage { margin-top: 16px; font-size: 14px; text-align: center; font-weight: 500; }
    .error { color: #dc2626; }
    .loading-slots { font-size: 12px; color: #64748b; margin-top: 4px; }
    div.img{ 
              display: block;
              margin: 0 auto 20px; }
    img.logo { 
             display: block;
  margin: 0 auto 20px;
  width: 150px;}


    /* Estilos do Comprovante */
    #receiptContainer { display: none; margin-top: 10px; }
    .receipt-card {
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: left;
    }
    .receipt-header { text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 16px; }
    .receipt-header h3 { margin: 0; color: #16a34a; font-size: 18px; }
    .receipt-header p { margin: 4px 0 0; font-size: 13px; color: #64748b; }
    .receipt-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .receipt-item span:first-child { color: #64748b; font-weight: 500; }
    .receipt-item span:last-child { color: #1e293b; font-weight: 600; text-align: right; }
    .btn-download { background: #16a34a; }
    .btn-download:hover { background: #15803d; }
    .btn-new { background: transparent; color: #64748b; border: 1px solid #cbd5e1; margin-top: 8px; font-size: 14px; }
    .btn-new:hover { background: #f1f5f9; color: #1e293b; }

  </style>
</head>
<body>

<div class="card">

  <img class="logo" src="download.png" alt="Logotipo do Instituto Ivanete Renovação, com arcos vermelho e cinza envolvendo o texto Instituto Ivanete Renovação. O design transmite acolhimento e renovação sobre fundo branco."> 
  <!--<img src="download.png" alt="Logotipo do Instituto Ivanete Renovação, com arcos vermelho e cinza envolvendo o texto Instituto Ivanete Renovação. O design transmite acolhimento e renovação sobre fundo branco." srcset=""> -->
  <h2>Agendamento Instituto Ivanete</h2>

  <img class="logo" id="logoImg" src="download.png" alt="Logo Instituto Ivanete" crossorigin="anonymous">
  <h2 id="cardTitle">Agendamento Instituto Ivanete</h2>
  
  <!-- FORMULÁRIO DE ENTRADA -->

  <form id="bookingForm">
    <div class="field">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" required>
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" required>
    </div>

    <div class="field">
      <label for="telefone">WhatsApp / Telefone</label>
      <input type="tel" id="telefone" placeholder="(DDD) 99999-9999" maxlength="15" required>
    </div>

    <div class="field">
      <label for="servico">Serviço</label>
      <select id="servico" required>
        <option value="Massoterapia">Massoterapia</option>
      </select>
    </div>

    <div class="row">
      <div class="field">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>
      <div class="field">
        <label for="horario">Horário</label>
        <select id="horario" required disabled>
          <option value="">Escolha serviço e data</option>
        </select>
        <div id="slotNotice" class="loading-slots"></div>
      </div>
    </div>

    <button type="submit" id="btnSubmit">Confirmar Agendamento</button>
    <div id="statusMessage"></div>
  </form>

  <!-- COMPROVANTE APÓS SUCESSO -->
  <div id="receiptContainer">
    <div class="receipt-card" id="receiptCard">
      <div class="receipt-header">
        <img class="logo" src="download.png" style="width: 100px; margin-bottom: 10px;" alt="Logo" crossorigin="anonymous">
        <h3>Agendamento Confirmado!</h3>
        <p>Instituto Ivanete Renovação</p>
      </div>
      <div class="receipt-item">
        <span>Cliente:</span>
        <span id="recNome"></span>
      </div>
      <div class="receipt-item">
        <span>Telefone:</span>
        <span id="recTelefone"></span>
      </div>
      <div class="receipt-item">
        <span>Serviço:</span>
        <span id="recServico"></span>
      </div>
      <div class="receipt-item">
        <span>Data:</span>
        <span id="recData"></span>
      </div>
      <div class="receipt-item">
        <span>Horário:</span>
        <span id="recHorario"></span>
      </div>
      <div class="receipt-item" style="margin-top: 16px; border-top: 1px dashed #e2e8f0; padding-top: 10px;">
        <span>Emitido em:</span>
        <span id="recTimestamp" style="font-size: 12px; color: #94a3b8;"></span>
      </div>
    </div>

    <button type="button" class="btn-download" id="btnDownload">Baixar Comprovante (Imagem)</button>
    <button type="button" class="btn-new" id="btnNovoAgendamento">Fazer Novo Agendamento</button>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzm2KOLDcz8Dzg-aEHH56Gx2xhiSjmEjP2FCE8O1cAUCpooNawhQVOUIG18lA_XRKzW/exec';

  const telInput = document.getElementById('telefone');
  const servicoSelect = document.getElementById('servico');
  const dataInput = document.getElementById('data');
  const horarioSelect = document.getElementById('horario');
  const slotNotice = document.getElementById('slotNotice');
  const form = document.getElementById('bookingForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const statusMsg = document.getElementById('statusMessage');

  // Elementos do comprovante
  const receiptContainer = document.getElementById('receiptContainer');
  const receiptCard = document.getElementById('receiptCard');
  const cardTitle = document.getElementById('cardTitle');
  const logoImg = document.getElementById('logoImg');
  const btnDownload = document.getElementById('btnDownload');
  const btnNovoAgendamento = document.getElementById('btnNovoAgendamento');

  // Máscara de Telefone
  telInput.addEventListener('input', (e) => {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length > 11) value = value.slice(0, 11);

    if (value.length > 10) {
      value = value.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    } else if (value.length > 6) {
      value = value.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
    } else if (value.length > 2) {
      value = value.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
    } else if (value.length > 0) {
      value = value.replace(/^(\d*)$/, '($1');
    }
    e.target.value = value;
  });

  // Limite de datas (30 dias)
  const DIAS_LIMITE = 30;
  const formatDateToYMD = (date) => {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  const agora = new Date();
  dataInput.min = formatDateToYMD(agora);

  const limiteFuturo = new Date();
  limiteFuturo.setDate(agora.getDate() + DIAS_LIMITE);
  dataInput.max = formatDateToYMD(limiteFuturo);

  // Consulta de Horários
  async function carregarHorariosDisponiveis() {
    const dataSelecionada = dataInput.value;
    const servicoSelecionado = servicoSelect.value;

    if (!dataSelecionada || !servicoSelecionado) {
      horarioSelect.disabled = true;
      horarioSelect.innerHTML = '<option value="">Escolha serviço e data</option>';
      slotNotice.textContent = '';
      return;
    }

    if (dataSelecionada > dataInput.max || dataSelecionada < dataInput.min) {
      horarioSelect.disabled = true;
      horarioSelect.innerHTML = '<option value="">Data fora do período</option>';
      slotNotice.textContent = `Apenas agendamentos para os próximos ${DIAS_LIMITE} dias.`;
      return;
    }

    horarioSelect.disabled = true;
    horarioSelect.innerHTML = '<option value="">Consultando horários...</option>';
    slotNotice.textContent = 'Verificando disponibilidade...';

    try {
      const url = `${SCRIPT_URL}?data=${encodeURIComponent(dataSelecionada)}&servico=${encodeURIComponent(servicoSelecionado)}`;
      const response = await fetch(url);
      const result = await response.json();
      
      const grade = result.grade || [];
      const ocupados = result.ocupados || [];

      horarioSelect.innerHTML = '<option value="">Selecione um horário</option>';
      let livresCount = 0;

      grade.forEach(hora => {
        const option = document.createElement('option');
        option.value = hora;

        if (ocupados.includes(hora)) {
          option.textContent = `${hora} (Indisponível)`;
          option.disabled = true;
        } else {
          option.textContent = hora;
          livresCount++;
        }
        horarioSelect.appendChild(option);
      });

      if (livresCount === 0) {
        slotNotice.textContent = 'Nenhum horário disponível para este serviço nesta data.';
      } else {
        slotNotice.textContent = '';
      }

      horarioSelect.disabled = false;
    } catch (err) {
      console.error(err);
      slotNotice.textContent = 'Erro ao buscar horários. Tente novamente.';
      horarioSelect.innerHTML = '<option value="">Erro ao carregar</option>';
    }
  }

  dataInput.addEventListener('change', carregarHorariosDisponiveis);
  servicoSelect.addEventListener('change', carregarHorariosDisponiveis);

  // Envio do formulário
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const telDigits = telInput.value.replace(/\D/g, '');
    if (telDigits.length < 10) {
      statusMsg.className = 'error';
      statusMsg.textContent = 'Por favor, digite um número de telefone válido com DDD.';
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Confirmando...';
    statusMsg.textContent = '';

    const payload = {
      nome: document.getElementById('nome').value,
      email: document.getElementById('email').value,
      telefone: telInput.value,
      servico: servicoSelect.value,
      data: dataInput.value,
      horario: horarioSelect.value
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      
      const res = await response.json();

      if (res.status === 'success') {
        // Preenche os dados do comprovante
        document.getElementById('recNome').textContent = payload.nome;
        document.getElementById('recTelefone').textContent = payload.telefone;
        document.getElementById('recServico').textContent = payload.servico;
        
        // Formata data para DD/MM/AAAA
        const [ano, mes, dia] = payload.data.split('-');
        document.getElementById('recData').textContent = `${dia}/${mes}/${ano}`;
        document.getElementById('recHorario').textContent = `${payload.horario}h`;
        
        const now = new Date();
        document.getElementById('recTimestamp').textContent = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR');

        // Alterna a tela para o comprovante
        form.style.display = 'none';
        logoImg.style.display = 'none';
        cardTitle.style.display = 'none';
        receiptContainer.style.display = 'block';

      } else {
        statusMsg.className = 'error';
        statusMsg.textContent = res.message || 'Erro ao agendar horário.';
      }
    } catch (err) {
      console.error(err);
      statusMsg.className = 'error';
      statusMsg.textContent = 'Erro ao processar o agendamento.';
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Confirmar Agendamento';
    }
  });

  // Download do comprovante em imagem
  btnDownload.addEventListener('click', () => {
    btnDownload.textContent = 'Gerando imagem...';
    btnDownload.disabled = true;

    html2canvas(receiptCard, {
      scale: 2, // Garante alta resolução na imagem
      backgroundColor: '#ffffff'
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `comprovante-agendamento-${document.getElementById('recNome').textContent.trim().toLowerCase().replace(/\s+/g, '-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      btnDownload.textContent = 'Baixar Comprovante (Imagem)';
      btnDownload.disabled = false;
    }).catch(err => {
      console.error('Erro ao gerar imagem:', err);
      alert('Não foi possível gerar a imagem. Você pode tirar um print da tela.');
      btnDownload.textContent = 'Baixar Comprovante (Imagem)';
      btnDownload.disabled = false;
    });
  });

  // Botão para agendar novamente
  btnNovoAgendamento.addEventListener('click', () => {
    form.reset();
    horarioSelect.innerHTML = '<option value="">Escolha serviço e data</option>';
    horarioSelect.disabled = true;
    
    receiptContainer.style.display = 'none';
    form.style.display = 'block';
    logoImg.style.display = 'block';
    cardTitle.style.display = 'block';
  });
</script>

</body>
</html>

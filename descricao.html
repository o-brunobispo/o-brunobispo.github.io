<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Automático de Empenho</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .header-section {
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .input-section {
            background: #eef2f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .file-upload { margin-bottom: 15px; }
        textarea#texto_colado {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            resize: vertical;
        }
        .btn-acao {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn-acao:hover { background-color: #d35400; }
        
        .result-section { 
            margin-bottom: 30px; 
            padding: 20px;
            background: #e8f6f3;
            border-left: 4px solid #1abc9c;
            border-radius: 0 8px 8px 0;
        }
        .result-box {
            position: relative;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border: 1px solid #1abc9c;
            border-radius: 8px;
        }
        .result-box textarea {
            width: 100%;
            height: 60px;
            resize: vertical;
            box-sizing: border-box;
            border: none;
            background: #fdfdfd;
            padding: 10px;
            font-size: 14px;
        }
        .btn-copy {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #16a085;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-copy:hover { background: #117a65; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; color: #34495e; }

        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: #fdfdfd;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #555;}
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus { border-color: #3498db; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>Gerador Automático de Empenho</h2>
        <p style="margin:0; font-size: 14px; color: #666;">Cole o texto ou faça upload do PDF para preenchimento automático.</p>
    </div>

    <!-- 1. Entrada de Dados -->
    <div class="input-section">
        <div class="file-upload">
            <label for="pdf_upload" style="font-size: 15px; color: #2980b9;">📄 <strong>Opção 1:</strong> Upload do PDF</label><br>
            <input type="file" id="pdf_upload" accept="application/pdf" style="margin-top: 5px;">
        </div>
        
        <label for="texto_colado" style="font-size: 15px; color: #2980b9;">📋 <strong>Opção 2:</strong> Colar o texto completo</label>
        <textarea id="texto_colado" placeholder="Cole todo o texto aqui..."></textarea>
        
        <button class="btn-acao" onclick="processarTexto()">Extrair Dados e Gerar Resultados</button>
    </div>

    <!-- 2. Resultados Finais -->
    <div class="result-section">
        <h3>Resultados Finais</h3>
        <div class="result-box">
            <div class="section-title">Observação da Nota de Empenho</div>
            <button class="btn-copy" onclick="copiarTexto('obs_result')">Copiar Observação</button>
            <textarea id="obs_result" readonly></textarea>
        </div>

        <div class="result-box">
            <div class="section-title">Linha da Tabela (Cole direto no Excel)</div>
            <button class="btn-copy" onclick="copiarTexto('tabela_result')">Copiar Tabela</button>
            <textarea id="tabela_result" readonly></textarea>
        </div>
    </div>

    <!-- 3. Revisão de Campos -->
    <h3>Revisão dos Dados Extraídos</h3>
    <div class="grid-form" id="formulario" oninput="gerarResultados()">
        <div class="form-group"><label>Nº da Requisição</label><input type="text" id="requisicao"></div>
        <div class="form-group"><label>Modalidade de Licitação</label><input type="text" id="modalidade"></div>
        <div class="form-group"><label>UASG</label><input type="text" id="uasg"></div>
        <div class="form-group"><label>Nota de Crédito e Data</label><input type="text" id="nc_data"></div>
        <div class="form-group"><label>Setor Requisitante</label><input type="text" id="setor"></div>
        <div class="form-group"><label>NUP do Pregão (Para Observação)</label><input type="text" id="nup_pregao"></div>
        <div class="form-group"><label>NUP DIEX (Para Tabela)</label><input type="text" id="nup_diex"></div>
        <div class="form-group"><label>Data Doc / Empenho</label><input type="text" id="data_doc"></div>
        <div class="form-group"><label>PI</label><input type="text" id="pi"></div>
        <div class="form-group"><label>Valor do Empenho</label><input type="text" id="valor"></div>
        <div class="form-group"><label>CNPJ Fornecedor</label><input type="text" id="cnpj"></div>
        <div class="form-group full-width"><label>Objeto/Descrição</label><input type="text" id="objeto"></div>
    </div>

</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    document.getElementById('pdf_upload').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async function(e) {
            const typedarray = new Uint8Array(e.target.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;
            let textoExtraido = "";

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.hasEOL ? item.str + '\n' : item.str).join(" ");
                textoExtraido += pageText + "\n";
            }
            
            document.getElementById('texto_colado').value = textoExtraido;
            processarTexto();
        };
        reader.readAsArrayBuffer(file);
    });

    function processarTexto() {
        const texto = document.getElementById('texto_colado').value;
        if(!texto.trim()) {
            alert("Por favor, cole um texto ou faça upload do PDF primeiro.");
            return;
        }

        // 1. Requisição
        const reqMatch = texto.match(/Requisição\s*[Nn]?[ºo]\s*([^\/\n\r]+)/i);
        if(reqMatch) document.getElementById('requisicao').value = "Requisição Nº " + reqMatch[1].trim();

        // 2. Modalidade
        const modMatch = texto.match(/PREGÃO\s*(?:nº\s*)?(\d+\/\d+)/i);
        if(modMatch) document.getElementById('modalidade').value = "PREGÃO " + modMatch[1].trim();

        // 3. UASG
        const uasgMatch = texto.match(/UASG\s*[:]?\s*(\d+\s*[-–]\s*[^\n\r]+)/i);
        if(uasgMatch) document.getElementById('uasg').value = uasgMatch[1].trim();
        else {
            const uasgNum = texto.match(/UASG\s*[:]?\s*(\d+)/i);
            if(uasgNum) document.getElementById('uasg').value = uasgNum[1].trim();
        }

        // 4. Nota de Crédito e Data
        const ncMatch = texto.match(/([A-Z0-9]+)\s+(\d{2}\/\d{2}\/\d{4})\s+\d+\s+\d+\s+\d+/);
        if(ncMatch) document.getElementById('nc_data').value = ncMatch[1] + " " + ncMatch[2];

        // 5. Setor Requisitante
        const setorMatch = texto.match(/Chefe do\s+([^\n\r]+)/i);
        if(setorMatch) document.getElementById('setor').value = setorMatch[1].trim();

        // 6.1 NUP do Pregão (Para Observação - Procura a palavra "NUP")
        const nupPregaoMatch = texto.match(/NUP\s*[:|]?\s*([\d\.\/\-]+)/i);
        if(nupPregaoMatch) document.getElementById('nup_pregao').value = nupPregaoMatch[1].trim();

        // 6.2 NUP DIEX (Para Tabela - Procura o "EB:")
        const nupDiexMatch = texto.match(/EB:\s*([\d\.\/\-]+)/i);
        if(nupDiexMatch) document.getElementById('nup_diex').value = nupDiexMatch[1].trim();

        // 7. Datas: Sempre a data atual (HOJE)
        const hoje = new Date();
        const dataAtual = String(hoje.getDate()).padStart(2, '0') + '/' + 
                          String(hoje.getMonth() + 1).padStart(2, '0') + '/' + 
                          hoje.getFullYear();
        document.getElementById('data_doc').value = dataAtual;

        // 8. PI
        const textoSemEspacos = texto.replace(/[\r\n\s]+/g, ''); 
        const piMatch = textoSemEspacos.match(/(D8[A-Z0-9]{9})/i);
        if (piMatch) {
            document.getElementById('pi').value = piMatch[1].toUpperCase();
        } else {
            document.getElementById('pi').value = 'D8SAFUNADOM'; 
        }

        // 9. Valor
        const valMatch = texto.match(/VALOR TOTAL\s+(R\$\s*[\d\.,]+)/i);
        if(valMatch) document.getElementById('valor').value = valMatch[1].trim();

        // 10. CNPJ
        const cnpjMatch = texto.match(/CNPJ\s*[:|]?\s*([\d\.\/\-]+)/i);
        if(cnpjMatch) document.getElementById('cnpj').value = cnpjMatch[1].trim();

        // 11. Objeto (Assunto)
        const objMatch = texto.match(/Assunto:\s*([^\n\r]+)/i);
        if(objMatch) document.getElementById('objeto').value = objMatch[1].trim();

        gerarResultados();
    }

    function gerarResultados() {
        const req = document.getElementById('requisicao').value.trim();
        const mod = document.getElementById('modalidade').value.trim();
        const uasg = document.getElementById('uasg').value.trim();
        const nc = document.getElementById('nc_data').value.trim();
        const setor = document.getElementById('setor').value.trim();
        const nup_pregao = document.getElementById('nup_pregao').value.trim();
        const nup_diex = document.getElementById('nup_diex').value.trim();
        const data = document.getElementById('data_doc').value.trim();
        const pi = document.getElementById('pi').value.trim();
        const valor = document.getElementById('valor').value.trim();
        const cnpj = document.getElementById('cnpj').value.trim();
        const obj = document.getElementById('objeto').value.trim();

        // Usa nup_pregao para a observação
        const arrayObs = [req, mod, uasg, nc, setor, nup_pregao].filter(Boolean);
        document.getElementById('obs_result').value = arrayObs.join(' ');
        
        // Usa nup_diex para a tabela
        const arrayTabela = [
            data, nup_diex, req, "", pi, obj, "", data, valor, setor, cnpj
        ];
        document.getElementById('tabela_result').value = arrayTabela.join('\t');
    }

    function copiarTexto(elementId) {
        const elemento = document.getElementById(elementId);
        elemento.select();
        elemento.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(elemento.value).then(() => {
            const btn = event.target;
            const textOriginal = btn.innerText;
            btn.innerText = "Copiado!";
            btn.style.background = "#117a65";
            setTimeout(() => { 
                btn.innerText = textOriginal; 
                btn.style.background = "#16a085";
            }, 2000);
        });
    }
</script>
</body>
</html>
